name: Scheduled Flight Scraper & Neon Pipeline (6 Batches)

on:
  schedule:
    # Runs everyday at 12:00 UTC ("12 o'clock")
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  scrape_and_sync:
    name: "Batch ${{ matrix.batch }} - ${{ matrix.direction }}"
    runs-on: ubuntu-latest
    environment: DATABASE_URL
    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 3 # Run up to 3 batches concurrently
      matrix:
        batch: [1, 2, 3]
        direction: [departures, arrivals]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium with System Dependencies
        run: |
          playwright install chromium --with-deps

      - name: Run Scraper & Push to Neon (Batch ${{ matrix.batch }} ${{ matrix.direction }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m src.batch_runner --batch ${{ matrix.batch }} --direction ${{ matrix.direction }} --headless

