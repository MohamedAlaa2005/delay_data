name: Scheduled Flight Scraper & Neon Pipeline (6 Batches)

on:
  schedule:
    # Runs every 12 hours at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  weather_sync:
    name: "Global Weather Sync (150 Airports - 24 Hours London Time)"
    runs-on: ubuntu-latest
    environment: DATABASE_URL
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest 24-Hour Weather in London Time
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m src.weather_runner

  scrape_and_sync:
    name: "Batch ${{ matrix.batch }} - ${{ matrix.direction }}"
    runs-on: ubuntu-latest
    environment: DATABASE_URL
    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 3 # Run up to 3 batches concurrently
      matrix:
        batch: [1, 2, 3]
        direction: [departures, arrivals]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Camoufox Browser & Virtual Display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m camoufox fetch

      - name: Run Scraper & Push to Neon (Batch ${{ matrix.batch }} ${{ matrix.direction }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run -a python -m src.batch_runner --batch ${{ matrix.batch }} --direction ${{ matrix.direction }}

